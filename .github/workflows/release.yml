name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0.0 のようなタグがプッシュされたときに実行

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write # Releasesを作成・アップロードするための権限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # またはプロジェクトに応じたバージョン

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # electron-builder等で必要な場合

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
